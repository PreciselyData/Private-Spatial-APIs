apiVersion: apps/v1
kind: Deployment
metadata:
  name: data-service
  labels:
    app: data-service
spec:
  replicas: {{ .Values.initReplicaCount }}
  selector:
    matchLabels:
      app: data-service
  template:
    metadata:
      labels:
        app: data-service
      annotations:
        prometheus.io/scrape: 'true'
        prometheus.io/path: '/actuator/prometheus'
        prometheus.io/port: '8080'
        spatial.build: {{ .Values.build | default .Chart.Version | quote }}
    spec:
      containers:
        - name: data-service
          {{- if .Values.global }}
          image: "{{ include "platform.globalRegistryUrl" . }}/{{ include "platform.pipelineImageName" (dict "root" . "imageName" "data-service") }}"
          {{- else }}
          image: "{{ .Values.registry.url }}/data-service:{{ .Values.registry.tag }}"
          {{- end }}
          imagePullPolicy: Always
          envFrom:
            - configMapRef:
                name: spatial-config
                optional: true
            - secretRef:
                name: spatial-config
                optional: true
          env:
            - name: JAVA_TOOL_OPTIONS
              value: $(jvm.opts.data)
            - name: ASYNC_VISIBILITY_TIMEOUT
              value: '5h'
            - name: UPLOAD_STAGING_DIR
              value: '/opt/data/upload/stage'
            - name: PRECISELY_LOAD_HISTORY_DIR
              value: '/opt/data/precisely/upload/history'
            - name: 'system.spatial.async.visibility-timeout'
              value: '5h'
          ports:
            - containerPort: 8080
              name: http
              protocol: TCP
          volumeMounts:
            - name: data
              mountPath: /opt/data
          resources:
            requests:
              cpu: {{ .Values.requestCPU }}
              memory: {{ .Values.requestMemory }}
            limits:
              {{- if .Values.limitCPU }}
              cpu: {{ .Values.limitCPU }}
              {{- end }}
              memory: {{ .Values.limitMemory }}
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 2
            successThreshold: 1
            failureThreshold: 30
          livenessProbe:
            # similar to the startupProbe except the failureThreshold is smaller
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            periodSeconds: 5
            timeoutSeconds: 2
            successThreshold: 1
            failureThreshold: 3
          readinessProbe:
            # similar to the livenessProbe
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            periodSeconds: 5
            timeoutSeconds: 2
            successThreshold: 1
            failureThreshold: 3
          lifecycle:
            preStop:
              exec:
                command: 
                  - sh
                  - -c
                  - "sleep 15"
      imagePullSecrets:
        {{- if .Values.global }}
        - name: {{ .Values.global.registry.secrets }}
        {{- else }}
        - name: {{ .Values.registry.secrets }}
        {{- end }}
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: data-volume-claim
      securityContext:
        fsGroup: 1000
      terminationGracePeriodSeconds: 60
