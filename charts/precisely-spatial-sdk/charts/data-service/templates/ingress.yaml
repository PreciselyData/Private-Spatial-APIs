apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: data-service
  annotations:
    {{- with .Values.global }}
    {{- with .cors }}
    {{- if eq .enabled true }}
    nginx.ingress.kubernetes.io/enable-cors: "true"
    nginx.ingress.kubernetes.io/cors-allow-credentials: {{ .allowCredentials | default "false" | quote }}
    nginx.ingress.kubernetes.io/cors-allow-headers: {{ .allowHeaders | default "*" | quote }}
    nginx.ingress.kubernetes.io/cors-allow-methods: {{ .allowMethods | default "*" | quote }}
    nginx.ingress.kubernetes.io/cors-allow-origin: {{ .allowOrigin | default "*" | quote }}
    nginx.ingress.kubernetes.io/cors-max-age: {{ .maxAge | default "3600" | quote }}
    {{- end }}
    {{- end }}
    {{- end }}
    {{- $ingress := default dict .Values.ingress }}
    {{- $proxyBodySize := $ingress.proxyBodySize }}
    {{- $proxyReadTimeout := $ingress.proxyReadTimeout }}
    {{- $proxySendTimeout := $ingress.proxySendTimeout }}
    {{- /* Allows configured large multipart uploads through nginx. */}}
    {{- if $proxyBodySize }}
    nginx.ingress.kubernetes.io/proxy-body-size: {{ $proxyBodySize | quote }}
    {{- end }}
    {{- /* Keeps long uploads from timing out at the ingress. */}}
    {{- if $proxyReadTimeout }}
    nginx.ingress.kubernetes.io/proxy-read-timeout: {{ $proxyReadTimeout | quote }}
    {{- end }}
    {{- if $proxySendTimeout }}
    nginx.ingress.kubernetes.io/proxy-send-timeout: {{ $proxySendTimeout | quote }}
    {{- end }}
    nginx.ingress.kubernetes.io/use-regex: "true"

spec:
  {{- if .Values.global }}
  ingressClassName: {{ .Values.global.ingress.ingressClassName | quote }}
  {{- else }}
  ingressClassName: "nginx"
  {{- end }}

  rules:
    {{- if .Values.global }}
    - host: {{ .Values.global.ingress.host | quote }}
    {{- else }}
    - host: {{ .Values.ingress.host | quote }}
    {{- end }}
      http:
        paths:
          - path: /v1/spatial/(data)
            pathType: ImplementationSpecific
            backend:
              service:
                name: data-service
                port:
                  number: 8080
          - path: /v1/spatial/data/precisely/(load|status|history)$
            pathType: ImplementationSpecific
            backend:
              service:
                name: data-service
                port:
                  number: 8080
          - path: /data
            pathType: Prefix
            backend:
              service:
                name: data-service
                port:
                  number: 8080