# Default values for platform.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

# Image registry
registry:
  url: "registry.gitlab.com/preciselydata/location-intelligence/spatial/spatial-analytics"
  tag: "latest"
  secrets: "regcred"

# HPA counts
initReplicaCount: 1
maxReplicaCount: 3

# Resources
requestCPU: "100m"
requestMemory: "1Gi"
limitCPU: "2"
limitMemory: "2Gi"

# Ingress
ingress:
  # A specific host should be specified when deploying into a namespace other than default.
  #   For convenience, a hostname in nip.io domain can be used,
  #     "spatial.<namespace>.172-30-33-53.nip.io"
  #
  host: ""
  # nginx upload body limit for multipart uploads.
  proxyBodySize: "360m"
  # nginx proxy timeouts in seconds.
  proxyReadTimeout: "300"
  proxySendTimeout: "120"
