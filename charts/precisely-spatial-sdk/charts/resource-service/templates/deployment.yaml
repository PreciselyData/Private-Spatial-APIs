### 
# This Deployment includes a Resource Service 
#
#   Note: localize the nfs mount and the path of the command before apply 
###

---
# Product - Resource Service
apiVersion: apps/v1
kind: Deployment
metadata:
  name: resource-service
  labels:
    app: resource-service
spec:
  replicas: {{ .Values.initReplicaCount }}
  selector:
    matchLabels:
      app: resource-service
  template:
    metadata:
      labels:
        app: resource-service
      annotations:
        prometheus.io/scrape: 'true'
        prometheus.io/path: '/actuator/prometheus'
        prometheus.io/port: '8080'
        spatial.build: {{ .Values.build | default .Chart.Version | quote }}
    spec:
      containers:
        - name: resource-service
          {{- if .Values.global }}
          image: "{{ include "platform.globalRegistryUrl" . }}/{{ include "platform.pipelineImageName" (dict "root" . "imageName" "resource-service") }}"
          {{- else }}
          image: "{{ .Values.registry.url }}/resource-service:{{ .Values.registry.tag }}"
          {{- end }}
          imagePullPolicy: Always
          envFrom:
            - configMapRef:
                name: spatial-config
                optional: true
            - secretRef:
                name: spatial-config
                optional: true
          env:
            - name: JAVA_TOOL_OPTIONS
              value: $(jvm.opts.resource)
            - name: spring.security.oauth2.resourceserver.jwt.jwk-set-uri
              value: $(oauth2.issuer-uri)/protocol/openid-connect/certs
            - name: MCP_SERVER_URL
              value: $(mcp.url)
          ports:
            - containerPort: 8080
              name: http
              protocol: TCP
          volumeMounts:
            - name: data
              mountPath: /opt/data
          resources:
            requests:
              cpu: {{ .Values.requestCPU }}
              memory: {{ .Values.requestMemory }}
            limits:
              {{- if .Values.limitCPU }}
              cpu: {{ .Values.limitCPU }}
              {{- end }}
              memory: {{ .Values.limitMemory }}
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 2
            successThreshold: 1
            failureThreshold: 30
          livenessProbe:
            # similar to the startupProbe except the failureThreshold is smaller
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            periodSeconds: 5
            timeoutSeconds: 2
            successThreshold: 1
            failureThreshold: 3
          readinessProbe:
            # similar to the livenessProbe
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            periodSeconds: 5
            timeoutSeconds: 2
            successThreshold: 1
            failureThreshold: 3
          lifecycle:
            preStop:
              exec:
                command: 
                  - sh
                  - -c
                  - "sleep 15"
      imagePullSecrets:
        {{- if .Values.global }}
        - name: {{ .Values.global.registry.secrets }}
        {{- else }}
        - name: {{ .Values.registry.secrets }}
        {{- end }}
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: data-volume-claim
      securityContext:
        fsGroup: 1000
      terminationGracePeriodSeconds: 60

