###
#   Values for deployment using GitLab container registry
###

# Global
global:
  registry:
    url: ""
    tag: latest
    secrets: regcred
  ingress:
    host: 

repository:
  mongodb:
    url: "mongodb://mongo-svc.mongo.svc.cluster.local/spatial-repository?authSource=admin&ssl=false"

# Individual service overrides
feature-service:
  requestCPU: "2"
  requestMemory: "2Gi"
  limitCPU: "4"
  limitMemory: "4Gi"
  initReplicaCount: 2
  maxReplicaCount: 4
  hpaEnabled: true
  hpaCpuAverageUtilization: 70

mapping-service:
  requestCPU: "2"
  requestMemory: "2Gi"
  limitCPU: "4"
  limitMemory: "4Gi"
  initReplicaCount: 2
  maxReplicaCount: 4
  hpaEnabled: true
  hpaCpuAverageUtilization: 70

tiling-service:
  requestCPU: "2"
  requestMemory: "2Gi"
  limitCPU: "4"
  limitMemory: "4Gi"
  initReplicaCount: 2
  maxReplicaCount: 4
  hpaEnabled: true
  hpaCpuAverageUtilization: 70
  
resource-service:
  requestCPU: "2"
  requestMemory: "2Gi"
  limitCPU: "4"
  limitMemory: "4Gi"
  initReplicaCount: 2
  maxReplicaCount: 4
  hpaEnabled: true
  hpaCpuAverageUtilization: 70

private-sdk-mcp:
  requestCPU: "200m"
  requestMemory: "512Mi"
  limitCPU: "500m"
  limitMemory: "1Gi"
  initReplicaCount: 2
  maxReplicaCount: 4
  hpaEnabled: true
  hpaCpuAverageUtilization: 70
  
composite-service:
  requestCPU: "2"
  requestMemory: "2Gi"
  limitCPU: "4"
  limitMemory: "4Gi"
  initReplicaCount: 2
  maxReplicaCount: 4
  hpaEnabled: true
  hpaCpuAverageUtilization: 70

spatial-platform-ux:
  requestCPU: "100m"
  requestMemory: "500Mi"
  limitCPU: "2"
  limitMemory: "2Gi"
  initReplicaCount: 2
  maxReplicaCount: 4
  hpaEnabled: true
  hpaCpuAverageUtilization: 70
  
data-service:
  requestCPU: "2"
  requestMemory: "2Gi"
  limitCPU: "4"
  limitMemory: "4Gi"
  initReplicaCount: 2
  maxReplicaCount: 4
  hpaEnabled: true
  hpaCpuAverageUtilization: 70

# END

